plugins { id 'net.minecraftforge.gradle' }
apply plugin: 'org.spongepowered.mixin'
mixin { add sourceSets.main, 'me_remote_machine.refmap.json'; config 'me_remote_machine.mixins.json' }
java { toolchain.languageVersion = JavaLanguageVersion.of(17); withSourcesJar() }
base { archivesName = 'me-access-forge-1.20.1' }
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        configureEach {
            workingDirectory file('run')
            args '--mixin', 'me_remote_machine.mixins.json'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', file('build/createSrgToMcp/output.srg').absolutePath
            jvmArg '-Xmx2G'
            mods { me_remote_machine { source sourceSets.main } }
        }
        client { }
        server { args '--nogui' }
    }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.18'
    implementation fg.deobf('appeng:appliedenergistics2-forge:15.4.10')
    runtimeOnly fg.deobf('org.appliedenergistics:guideme:20.1.7')
    compileOnly fg.deobf('mekanism:Mekanism:1.20.1-10.4.16.80')
    if (project.hasProperty('withMekanism')) runtimeOnly fg.deobf('mekanism:Mekanism:1.20.1-10.4.16.80')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}
jar { manifest.attributes('MixinConfigs': 'me_remote_machine.mixins.json'); finalizedBy 'reobfJar' }
